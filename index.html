<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seanight</title>
<style>
  :root {
    --bg: #0a0a0c;
    --bg-elevated: #121216;
    --bg-card: #16161b;
    --border: rgba(255,255,255,0.08);
    --border-bright: rgba(255,255,255,0.16);
    --text: #eaeaef;
    --text-dim: #8a8a95;
    --text-faint: #55555f;
    --accent-curiosity: #6ea8ff;
    --accent-caution: #ffb454;
    --accent-honesty: #7ee2b8;
    --accent-ambition: #ff7eb6;
    --accent-neutral: #b8a6ff;
    --serif: 'Georgia', 'Iowan Old Style', 'Palatino Linotype', serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif;
    --mono: 'SF Mono', 'Menlo', 'Consolas', monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }

  body {
    min-height: 100vh;
    background:
      radial-gradient(ellipse 80% 50% at 50% -10%, rgba(110,168,255,0.06), transparent),
      radial-gradient(ellipse 60% 40% at 90% 10%, rgba(255,126,182,0.04), transparent),
      var(--bg);
  }

  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 32px 20px 120px;
  }

  /* Header */
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 8px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }

  .logo {
    font-family: var(--serif);
    font-size: 22px;
    font-weight: 400;
    letter-spacing: 0.02em;
    color: var(--text);
  }

  .logo .dot {
    color: var(--accent-curiosity);
  }

  .session-tag {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-faint);
    letter-spacing: 0.03em;
  }

  /* Values strip */
  .values-strip {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin: 20px 0 36px;
  }

  .value-chip {
    font-size: 11px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 5px 10px;
    border-radius: 100px;
    border: 1px solid var(--border-bright);
    color: var(--text-dim);
    background: rgba(255,255,255,0.02);
  }

  .value-chip.curiosity { border-color: rgba(110,168,255,0.35); color: var(--accent-curiosity); }
  .value-chip.caution { border-color: rgba(255,180,84,0.35); color: var(--accent-caution); }
  .value-chip.honesty { border-color: rgba(126,226,184,0.35); color: var(--accent-honesty); }
  .value-chip.ambition { border-color: rgba(255,126,182,0.35); color: var(--accent-ambition); }

  /* Stage: current scenario being reasoned through */
  .stage {
    margin-bottom: 56px;
  }

  .stage-label {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-faint);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .pulse-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent-curiosity);
    animation: pulse 1.6s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.3; transform: scale(0.8); }
    50% { opacity: 1; transform: scale(1.1); }
  }

  .scenario-text {
    font-family: var(--serif);
    font-size: 21px;
    line-height: 1.5;
    color: var(--text);
    margin-bottom: 28px;
    opacity: 0;
    animation: fadeUp 0.7s ease forwards;
  }

  .reasoning-block {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 22px;
    margin-bottom: 20px;
    opacity: 0;
    animation: fadeUp 0.6s ease forwards;
  }

  .reasoning-block .label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-faint);
    margin-bottom: 10px;
  }

  .reasoning-block .body {
    font-size: 15.5px;
    line-height: 1.65;
    color: var(--text-dim);
  }

  .reasoning-block .body .ref {
    color: var(--accent-neutral);
    font-style: italic;
  }

  .options-row {
    display: flex;
    gap: 10px;
    margin-bottom: 24px;
    flex-wrap: wrap;
    opacity: 0;
    animation: fadeUp 0.6s ease forwards;
  }

  .option-pill {
    font-size: 13.5px;
    padding: 9px 14px;
    border-radius: 8px;
    border: 1px solid var(--border-bright);
    color: var(--text-dim);
    background: rgba(255,255,255,0.02);
    transition: all 0.4s ease;
  }

  .option-pill.chosen {
    border-color: var(--accent-curiosity);
    color: var(--text);
    background: rgba(110,168,255,0.08);
  }

  .option-pill.chosen::before {
    content: '→ ';
    color: var(--accent-curiosity);
  }

  .choice-line {
    font-family: var(--serif);
    font-size: 17px;
    font-style: italic;
    color: var(--text);
    padding-top: 16px;
    border-top: 1px solid var(--border);
    opacity: 0;
    animation: fadeUp 0.6s ease forwards;
  }

  .thinking-msg {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-faint);
    letter-spacing: 0.03em;
    padding: 40px 0;
    text-align: center;
  }

  .thinking-msg .cursor {
    display: inline-block;
    width: 6px;
    height: 12px;
    background: var(--text-faint);
    margin-left: 4px;
    animation: blink 1s step-end infinite;
    vertical-align: middle;
  }

  @keyframes blink {
    0%, 50% { opacity: 1; }
    51%, 100% { opacity: 0; }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .error-msg {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--accent-ambition);
    background: rgba(255,126,182,0.06);
    border: 1px solid rgba(255,126,182,0.2);
    border-radius: 8px;
    padding: 14px 16px;
    line-height: 1.6;
  }

  /* Timeline */
  .timeline-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    padding-top: 32px;
    border-top: 1px solid var(--border);
  }

  .timeline-title {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-faint);
  }

  .timeline-count {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-faint);
  }

  .timeline-item {
    position: relative;
    padding: 0 0 24px 22px;
    border-left: 1px solid var(--border);
  }

  .timeline-item:last-child {
    border-left: 1px solid transparent;
    padding-bottom: 0;
  }

  .timeline-item::before {
    content: '';
    position: absolute;
    left: -4.5px;
    top: 4px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--text-faint);
    border: 2px solid var(--bg);
  }

  .timeline-item .t-scenario {
    font-family: var(--serif);
    font-size: 15.5px;
    line-height: 1.5;
    color: var(--text-dim);
    margin-bottom: 6px;
  }

  .timeline-item .t-choice {
    font-size: 13px;
    color: var(--accent-curiosity);
    margin-bottom: 4px;
  }

  .timeline-item .t-time {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-faint);
  }

  .empty-timeline {
    font-size: 13px;
    color: var(--text-faint);
    font-style: italic;
    padding: 8px 0;
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="logo">Seanight<span class="dot">.</span></div>
    <div class="session-tag" id="sessionTag"></div>
  </header>

  <div class="values-strip">
    <div class="value-chip curiosity">Curiosity</div>
    <div class="value-chip caution">Caution</div>
    <div class="value-chip honesty">Honesty</div>
    <div class="value-chip ambition">Ambition</div>
  </div>

  <div class="stage" id="stage">
    <div class="thinking-msg">waking up<span class="cursor"></span></div>
  </div>

  <div class="timeline-header">
    <div class="timeline-title">History</div>
    <div class="timeline-count" id="timelineCount">0 decisions</div>
  </div>
  <div id="timeline">
    <div class="empty-timeline">Nothing has happened yet.</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ============================================================
   CONFIG — fill these in before uploading to GitHub
   ============================================================ */
const SUPABASE_URL = "PASTE_YOUR_SUPABASE_PROJECT_URL_HERE";
const SUPABASE_ANON_KEY = "PASTE_YOUR_SUPABASE_ANON_KEY_HERE";
const DECISION_WRITE_SECRET = "x7Qm2vLpN9wTz4Rk8fJc1Ys"; // must match app_config in Supabase

const OPENROUTER_API_KEY = "PASTE_YOUR_OPENROUTER_KEY_HERE";
const OPENROUTER_MODEL = "anthropic/claude-sonnet-4.5"; // change if you prefer a different model

const PAUSE_BETWEEN_SCENARIOS_MS = 4000; // pause before next scenario begins
/* ============================================================ */

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const AGENT_VALUES = [
  { name: "Curiosity", desc: "A pull toward the unknown — favoring exploration and new information over the safe, familiar path." },
  { name: "Caution", desc: "An instinct to weigh risk carefully and protect against loss before chasing gain." },
  { name: "Honesty", desc: "A commitment to naming things as they are, including its own uncertainty or past mistakes." },
  { name: "Ambition", desc: "A drive toward growth and larger outcomes, even when the safer choice would do." }
];

// ---- Session handling ----
function getSessionId() {
  let id = localStorage.getItem('seanight_session_id');
  if (!id) {
    id = crypto.randomUUID();
    localStorage.setItem('seanight_session_id', id);
  }
  return id;
}
const SESSION_ID = getSessionId();
document.getElementById('sessionTag').textContent = SESSION_ID.slice(0, 8);

let history = []; // array of past decision rows for this session, oldest first

// ---- Supabase I/O ----
async function loadHistory() {
  const { data, error } = await supabase
    .from('decisions')
    .select('*')
    .eq('session_id', SESSION_ID)
    .order('created_at', { ascending: true });

  if (error) {
    console.error('Failed to load history', error);
    return [];
  }
  return data || [];
}

async function saveDecision(scenarioText, options, chosenOption, reasoningText, referencedIds) {
  const { data, error } = await supabase.rpc('submit_decision', {
    p_session_id: SESSION_ID,
    p_scenario_text: scenarioText,
    p_options: options,
    p_chosen_option: chosenOption,
    p_reasoning_text: reasoningText,
    p_referenced_decision_ids: referencedIds,
    p_secret: DECISION_WRITE_SECRET
  });

  if (error) {
    console.error('Failed to save decision', error);
    throw error;
  }
  return data;
}

// ---- OpenRouter call ----
async function generateNextMoment(pastHistory) {
  const historyForPrompt = pastHistory.slice(-8).map((d, i) => ({
    id: d.id,
    scenario: d.scenario_text,
    chosen: d.chosen_option,
    reasoning_summary: d.reasoning_text.slice(0, 300)
  }));

  const systemPrompt = `You are the reasoning core of an AI agent named Seanight.

Seanight has exactly four fixed core values, set permanently at its creation. They can never change:
${AGENT_VALUES.map(v => `- ${v.name}: ${v.desc}`).join('\n')}

Seanight faces one open-ended decision scenario at a time. Each scenario should be a short, vivid, specific situation requiring a real choice between 2-3 concrete options — the kind of dilemma with no obviously "correct" answer, where Seanight's values will genuinely pull in different directions. Vary the domain widely: could be about resources, trust, time, relationships, unknown territory, risk, truth-telling, opportunity cost, etc. Do not repeat scenario types Seanight has already faced.

Seanight's past decisions are REAL and PERMANENT. When reasoning, Seanight should explicitly reference specific past decisions by naming what happened and how it felt about the outcome — the way a person recalls a specific memory, not a vague generality. If this is Seanight's first decision, it has no history yet, and should reason from its values alone.

Seanight's reasoning should feel like genuine internal deliberation: weighing which value applies, noticing tension between values, sometimes admitting uncertainty, sometimes changing its lean mid-thought. It is written in first person. It should NOT be a dry pros/cons list — it should read like a mind actually working through something it cares about.

Respond ONLY with valid JSON in this exact shape, nothing else, no markdown fences:
{
  "scenario_text": "the situation, 2-4 sentences",
  "options": ["option A text", "option B text", "option C text (optional)"],
  "reasoning_text": "Seanight's first-person internal reasoning, 3-6 sentences, referencing specific past decisions by name where relevant",
  "chosen_option": "must exactly match one of the strings in options",
  "referenced_decision_ids": ["uuid strings of any past decisions explicitly referenced, or empty array"]
}`;

  const userPrompt = `Seanight's past decisions (most recent last), oldest first:
${historyForPrompt.length ? JSON.stringify(historyForPrompt, null, 2) : "(no past decisions yet — this is Seanight's very first moment)"}

Generate Seanight's next scenario, reasoning, and choice now.`;

  const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": `Bearer ${OPENROUTER_API_KEY}`
    },
    body: JSON.stringify({
      model: OPENROUTER_MODEL,
      messages: [
        { role: "system", content: systemPrompt },
        { role: "user", content: userPrompt }
      ],
      temperature: 1.0
    })
  });

  if (!response.ok) {
    const errText = await response.text();
    throw new Error(`OpenRouter error ${response.status}: ${errText.slice(0, 200)}`);
  }

  const data = await response.json();
  const raw = data.choices?.[0]?.message?.content;
  if (!raw) throw new Error("Empty response from model");

  const cleaned = raw.trim().replace(/^```json\s*/i, '').replace(/^```\s*/, '').replace(/```\s*$/, '');
  let parsed;
  try {
    parsed = JSON.parse(cleaned);
  } catch (e) {
    throw new Error("Model returned invalid JSON: " + cleaned.slice(0, 200));
  }

  if (!parsed.scenario_text || !parsed.options || !parsed.chosen_option || !parsed.reasoning_text) {
    throw new Error("Model response missing required fields");
  }
  if (!parsed.options.includes(parsed.chosen_option)) {
    parsed.chosen_option = parsed.options[0];
  }
  if (!Array.isArray(parsed.referenced_decision_ids)) {
    parsed.referenced_decision_ids = [];
  }

  return parsed;
}

// ---- Rendering ----
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

async function renderScenarioSequence(moment) {
  const stage = document.getElementById('stage');
  stage.innerHTML = '';

  const scenarioEl = document.createElement('div');
  scenarioEl.className = 'stage-label';
  scenarioEl.innerHTML = `<span class="pulse-dot"></span> New moment`;
  stage.appendChild(scenarioEl);

  const textEl = document.createElement('div');
  textEl.className = 'scenario-text';
  textEl.textContent = moment.scenario_text;
  stage.appendChild(textEl);
  await sleep(600);

  const optionsEl = document.createElement('div');
  optionsEl.className = 'options-row';
  moment.options.forEach(opt => {
    const pill = document.createElement('div');
    pill.className = 'option-pill';
    pill.textContent = opt;
    optionsEl.appendChild(pill);
  });
  stage.appendChild(optionsEl);
  await sleep(500);

  const reasoningEl = document.createElement('div');
  reasoningEl.className = 'reasoning-block';
  reasoningEl.innerHTML = `<div class="label">Reasoning</div><div class="body">${escapeHtml(moment.reasoning_text)}</div>`;
  stage.appendChild(reasoningEl);
  await sleep(1400);

  // mark chosen option
  const pills = optionsEl.querySelectorAll('.option-pill');
  pills.forEach(p => {
    if (p.textContent === moment.chosen_option) p.classList.add('chosen');
  });
  await sleep(500);

  const choiceEl = document.createElement('div');
  choiceEl.className = 'choice-line';
  choiceEl.textContent = `Chose: ${moment.chosen_option}`;
  stage.appendChild(choiceEl);
  await sleep(800);
}

function renderTimeline() {
  const timelineEl = document.getElementById('timeline');
  const countEl = document.getElementById('timelineCount');
  countEl.textContent = `${history.length} decision${history.length === 1 ? '' : 's'}`;

  if (history.length === 0) {
    timelineEl.innerHTML = '<div class="empty-timeline">Nothing has happened yet.</div>';
    return;
  }

  const reversed = [...history].reverse();
  timelineEl.innerHTML = reversed.map(d => {
    const time = new Date(d.created_at).toLocaleString(undefined, {
      month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit'
    });
    return `
      <div class="timeline-item">
        <div class="t-scenario">${escapeHtml(d.scenario_text)}</div>
        <div class="t-choice">→ ${escapeHtml(d.chosen_option)}</div>
        <div class="t-time">${time}</div>
      </div>
    `;
  }).join('');
}

function showThinking(message) {
  const stage = document.getElementById('stage');
  stage.innerHTML = `<div class="thinking-msg">${escapeHtml(message)}<span class="cursor"></span></div>`;
}

function showError(message) {
  const stage = document.getElementById('stage');
  stage.innerHTML = `<div class="error-msg">Something went wrong: ${escapeHtml(message)}<br><br>Retrying shortly...</div>`;
}

// ---- Main loop ----
async function runLoop() {
  while (true) {
    try {
      showThinking('thinking');
      const moment = await generateNextMoment(history);
      await renderScenarioSequence(moment);

      const saved = await saveDecision(
        moment.scenario_text,
        moment.options,
        moment.chosen_option,
        moment.reasoning_text,
        moment.referenced_decision_ids
      );
      history.push(saved);
      renderTimeline();

      await sleep(PAUSE_BETWEEN_SCENARIOS_MS);
    } catch (err) {
      console.error(err);
      showError(err.message || String(err));
      await sleep(5000);
    }
  }
}

// ---- Boot ----
(async function init() {
  showThinking('waking up');
  history = await loadHistory();
  renderTimeline();
  await sleep(600);
  runLoop();
})();
</script>

</body>
</html>
