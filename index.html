<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seanight</title>
<style>
  :root {
    --bg: #0a0a0c;
    --bg-elevated: #121216;
    --bg-card: #16161b;
    --border: rgba(255,255,255,0.08);
    --border-bright: rgba(255,255,255,0.16);
    --text: #eaeaef;
    --text-dim: #8a8a95;
    --text-faint: #55555f;
    --accent-curiosity: #6ea8ff;
    --accent-caution: #ffb454;
    --accent-honesty: #7ee2b8;
    --accent-ambition: #ff7eb6;
    --accent-neutral: #b8a6ff;
    --accent-error: #ff6b6b;
    --serif: 'Georgia', 'Iowan Old Style', 'Palatino Linotype', serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif;
    --mono: 'SF Mono', 'Menlo', 'Consolas', monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:var(--bg); color:var(--text); font-family:var(--sans); -webkit-font-smoothing:antialiased; }
  body {
    min-height: 100vh;
    background:
      radial-gradient(ellipse 80% 50% at 50% -10%, rgba(110,168,255,0.06), transparent),
      radial-gradient(ellipse 60% 40% at 90% 10%, rgba(255,126,182,0.04), transparent),
      var(--bg);
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 32px 20px 120px; }

  header { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:8px; padding-bottom:20px; border-bottom:1px solid var(--border); }
  .logo { font-family: var(--serif); font-size: 22px; color: var(--text); }
  .logo .dot { color: var(--accent-curiosity); }
  .session-tag { font-family: var(--mono); font-size: 10px; color: var(--text-faint); }

  .values-strip { display:flex; gap:6px; flex-wrap:wrap; margin: 20px 0 28px; }
  .value-chip { font-size:11px; letter-spacing:0.04em; text-transform:uppercase; padding:5px 10px; border-radius:100px; border:1px solid var(--border-bright); color:var(--text-dim); background:rgba(255,255,255,0.02); }
  .value-chip.curiosity { border-color: rgba(110,168,255,0.35); color: var(--accent-curiosity); }
  .value-chip.caution { border-color: rgba(255,180,84,0.35); color: var(--accent-caution); }
  .value-chip.honesty { border-color: rgba(126,226,184,0.35); color: var(--accent-honesty); }
  .value-chip.ambition { border-color: rgba(255,126,182,0.35); color: var(--accent-ambition); }

  /* Objective input */
  .objective-form { margin-bottom: 36px; }
  .objective-form label { font-family: var(--mono); font-size: 11px; letter-spacing:0.08em; text-transform:uppercase; color: var(--text-faint); display:block; margin-bottom: 10px; }
  .objective-input-row { display:flex; gap:8px; }
  textarea.objective-input {
    flex: 1;
    background: var(--bg-card);
    border: 1px solid var(--border-bright);
    border-radius: 10px;
    padding: 12px 14px;
    color: var(--text);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.5;
    resize: vertical;
    min-height: 52px;
  }
  textarea.objective-input:focus { outline: none; border-color: var(--accent-curiosity); }
  button.submit-btn {
    background: var(--accent-curiosity);
    color: #0a0a0c;
    border: none;
    border-radius: 10px;
    padding: 0 20px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }
  button.submit-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* Status pipeline */
  .pipeline { display:flex; flex-wrap:wrap; gap:6px; margin-bottom: 28px; }
  .pipeline-step {
    font-family: var(--mono); font-size: 10.5px; letter-spacing:0.03em;
    padding: 6px 10px; border-radius: 6px; border:1px solid var(--border);
    color: var(--text-faint); background: rgba(255,255,255,0.015);
    display:flex; align-items:center; gap:6px;
  }
  .pipeline-step.active { border-color: var(--accent-curiosity); color: var(--accent-curiosity); background: rgba(110,168,255,0.06); }
  .pipeline-step.done { border-color: rgba(126,226,184,0.3); color: var(--accent-honesty); }
  .pipeline-step.error { border-color: rgba(255,107,107,0.4); color: var(--accent-error); }
  .step-dot { width:6px; height:6px; border-radius:50%; background: currentColor; }
  .pipeline-step.active .step-dot { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:.3;transform:scale(.8)} 50%{opacity:1;transform:scale(1.1)} }

  /* Execution stage */
  .stage { margin-bottom: 44px; }
  .stage-label { font-family: var(--mono); font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-faint); margin-bottom:14px; }

  .plan-block, .agent-block, .verify-block, .result-block {
    background: var(--bg-card); border:1px solid var(--border); border-radius:12px;
    padding: 18px 20px; margin-bottom: 14px; opacity:0; animation: fadeUp .6s ease forwards;
  }
  .plan-block .label, .agent-block .label, .verify-block .label, .result-block .label {
    font-family: var(--mono); font-size:10px; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-faint); margin-bottom: 8px;
    display:flex; align-items:center; gap:8px;
  }
  .agent-role-tag { font-size: 9.5px; padding: 2px 8px; border-radius: 100px; border:1px solid var(--border-bright); text-transform:uppercase; letter-spacing:0.04em; }
  .agent-role-tag.research { color: var(--accent-curiosity); border-color: rgba(110,168,255,0.35); }
  .agent-role-tag.analysis { color: var(--accent-neutral); border-color: rgba(184,166,255,0.35); }
  .agent-role-tag.coding { color: var(--accent-caution); border-color: rgba(255,180,84,0.35); }
  .agent-role-tag.verification { color: var(--accent-honesty); border-color: rgba(126,226,184,0.35); }

  .plan-block ol { margin: 0; padding-left: 18px; color: var(--text-dim); font-size: 14px; line-height: 1.7; }
  .agent-block .subtask-text { font-family: var(--serif); font-size: 15.5px; color: var(--text); margin-bottom: 10px; line-height: 1.5; }
  .agent-block .output-text { font-size: 14px; color: var(--text-dim); line-height: 1.65; white-space: pre-wrap; }
  .agent-block.failed { border-color: rgba(255,107,107,0.3); }
  .agent-block .status-line { font-size: 12px; color: var(--accent-error); margin-top: 8px; }

  .verify-block.passed { border-color: rgba(126,226,184,0.3); }
  .verify-block.failed { border-color: rgba(255,107,107,0.3); }
  .verify-block .verdict { font-family: var(--serif); font-style: italic; font-size: 15px; }
  .verify-block.passed .verdict { color: var(--accent-honesty); }
  .verify-block.failed .verdict { color: var(--accent-error); }

  .result-block { border-color: var(--border-bright); }
  .result-block .body { font-family: var(--serif); font-size: 16.5px; line-height: 1.6; color: var(--text); white-space: pre-wrap; }

  .thinking-msg { font-family: var(--mono); font-size:12px; color:var(--text-faint); padding: 24px 0; text-align:center; }
  .thinking-msg .cursor { display:inline-block; width:6px; height:12px; background:var(--text-faint); margin-left:4px; animation: blink 1s step-end infinite; vertical-align:middle; }
  @keyframes blink { 0%,50%{opacity:1} 51%,100%{opacity:0} }
  @keyframes fadeUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

  .error-msg {
    font-family: var(--mono); font-size:12.5px; color: var(--accent-error);
    background: rgba(255,107,107,0.06); border:1px solid rgba(255,107,107,0.25);
    border-radius:8px; padding: 14px 16px; line-height:1.6; white-space: pre-wrap;
  }

  .history-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; padding-top:32px; border-top:1px solid var(--border); }
  .history-title { font-family: var(--mono); font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-faint); }
  .history-count { font-family: var(--mono); font-size:11px; color:var(--text-faint); }
  .history-item { position:relative; padding:0 0 22px 22px; border-left:1px solid var(--border); }
  .history-item:last-child { border-left:1px solid transparent; padding-bottom:0; }
  .history-item::before { content:''; position:absolute; left:-4.5px; top:4px; width:8px; height:8px; border-radius:50%; background:var(--text-faint); border:2px solid var(--bg); }
  .history-item.completed::before { background: var(--accent-honesty); }
  .history-item.error::before { background: var(--accent-error); }
  .history-item .h-objective { font-family: var(--serif); font-size:15px; line-height:1.5; color:var(--text-dim); margin-bottom:6px; }
  .history-item .h-status { font-size:12px; margin-bottom:4px; }
  .history-item .h-status.completed { color: var(--accent-honesty); }
  .history-item .h-status.error { color: var(--accent-error); }
  .history-item .h-time { font-family: var(--mono); font-size:10px; color:var(--text-faint); }
  .empty-history { font-size:13px; color:var(--text-faint); font-style:italic; }
</style>
</head>

  <header>
    <div class="logo">Seanight<span class="dot">.</span></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>

const OPENROUTER_API_KEY = "";
const OPENROUTER_MODEL = "anthropic/claude-sonnet-4.5";

const MAX_RETRIES_PER_SUBTsk-or-v1-5905b3f4de3be5c33038f6b18bde682ba6c0fe963ccb95baadc48129c933a1a1ASK = 2;
/* ============================================================ */

let supabase;
let SUPABASE_READY = false;
try {
  const urlLooksReal = SUPABASE_URL.startsWith('http') && !SUPABASE_URL.includes('PASTE_');
  const keyLooksReal = (SUPABASE_ANON_KEY.startsWith('sb_') || SUPABASE_ANON_KEY.startsWith('eyJ')) && !SUPABASE_ANON_KEY.includes('PASTE_');
  if (urlLooksReal && keyLooksReal) {

} catch (e) {

const AGENT_VALUES = [
  { name: "Curiosity", desc: "A pull toward the unknown — favoring exploration and new information over the safe, familiar path." },
  { name: "Caution", desc: "An instinct to weigh risk carefully and protect against loss before chasing gain." },
  { name: "Honesty", desc: "A commitment to naming things as they are, including its own uncertainty or past mistakes." },
  { name: "Ambition", desc: "A drive toward growth and larger outcomes, even when the safer choice would do." }
];

const PIPELINE_STEPS = [
  { key: 'waking', label: 'Waking up' },
  { key: 'connecting', label: 'Connecting' },
  { key: 'planning', label: 'Planning' },
  { key: 'executing', label: 'Executing' },
  { key: 'verifying', label: 'Verifying' },
  { key: 'completed', label: 'Completed' }
];

function getSessionId() {
  let id = localStorage.getItem('seanight_session_id');
  if (!id) { id = crypto.randomUUID(); localStorage.setItem('seanight_session_id', id); }
  return id;
}
const SESSION_ID = getSessionId();
document.getElementById('sessionTag').textContent = SESSION_ID.slice(0, 8);

let history = [];
let currentPipelineStep = 'waking';
let pipelineHasError = false;

// ---- Pipeline rendering ----
function setPipelineStep(key, isError) {
  currentPipelineStep = key;
  pipelineHasError = !!isError;
  renderPipeline();
}
function renderPipeline() {
  const el = document.getElementById('pipeline');
  const currentIdx = PIPELINE_STEPS.findIndex(s => s.key === currentPipelineStep);
  el.innerHTML = PIPELINE_STEPS.map((s, i) => {
    let cls = '';
    if (i < currentIdx) cls = 'done';
    else if (i === currentIdx) cls = pipelineHasError ? 'error' : 'active';
    return `<div class="pipeline-step ${cls}"><span class="step-dot"></span>${s.label}</div>`;
  }).join('');
}

// ---- Supabase I/O (all guarded — never throw if misconfigured) ----
async function safeCall(fn, fallback) {
  if (!SUPABASE_READY) return fallback;
  try { return await fn(); } catch (e) { console.error(e); return fallback; }
}

async function loadHistory() {
  return safeCall(async () => {
    const { data, error } = await supabase
      .from('objectives').select('*').eq('session_id', SESSION_ID)
      .order('created_at', { ascending: true });
    if (error) throw error;
    return data || [];
  }, []);
}

      p_session_id: SESSION_ID, p_objective_text: text, p_secret: DECISION_WRITE_SECRET
    });
    if (error) throw error;
    return data;
  }, null);
}

}

async function dbUpdateSubtask(id, fields) {

async function dbSubmitVerification(objectiveId, passed, notes) {
  return safeCall(async () => {
    const { data, error } = await supabase.rpc('submit_verification', {

    });

// ---- OpenRouter call (shared) ----
async function callModel(systemPrompt, userPrompt, expectJson) {
  if (!OPENROUTER_API_KEY || OPENROUTER_API_KEY.startsWith('PASTE_')) {
    throw new Error('OpenRouter API key is not configured. Edit index.html and set OPENROUTER_API_KEY.');
  }
  const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": `Bearer ${OPENROUTER_API_KEY}` },
    body: JSON.stringify({
      model: OPENROUTER_MODEL,
      messages: [{ role: "system", content: systemPrompt }, { role: "user", content: userPrompt }],
      temperature: 0.9
    })
  });
  if (!response.ok) {
    const errText = await response.text();
    throw new Error(`OpenRouter error ${response.status}: ${errText.slice(0, 300)}`);
  }
  const data = await response.json();
  const raw = data.choices?.[0]?.message?.content;
  if (!raw) throw new Error("Empty response from model");
  if (!expectJson) return raw.trim();

  const cleaned = raw.trim().replace(/^```json\s*/i, '').replace(/^```\s*/, '').replace(/```\s*$/, '');
  try { return JSON.parse(cleaned); }
  catch (e) { throw new Error("Model returned invalid JSON: " + cleaned.slice(0, 200)); }
}

// ---- Planner ----
async function planObjective(objectiveText) {
  const system = `You are Seanight's Planner. Seanight has four fixed values: ${AGENT_VALUES.map(v=>v.name).join(', ')}.
Break the user's objective into 2-5 concrete subtasks. Each subtask must be assigned to exactly one agent role from this fixed set:
- "research": gathering or recalling factual information relevant to the objective
- "analysis": reasoning about, comparing, or synthesizing information into a conclusion
- "coding": writing a small, self-contained piece of JavaScript that computes or demonstrates something. IMPORTANT: this runs in a sandboxed iframe with NO network access, NO npm packages, NO Node/Python APIs — pure vanilla JS only (loops, math, string/array manipulation, JSON). Only assign this role if the objective genuinely needs computed output. The code must call a global function called reportResult(value) exactly once with its final answer.
- "verification": checking whether prior outputs actually satisfy part of the objective

Order subtasks so dependencies come first. Respond ONLY with valid JSON, no markdown fences:
{
  "subtasks": [
    { "agent_role": "research"|"analysis"|"coding"|"verification", "subtask_text": "specific instruction for this agent" }
  ]
}`;
  const user = `Objective: ${objectiveText}`;
  const result = await callModel(system, user, true);
  if (!result.subtasks || !Array.isArray(result.subtasks) || result.subtasks.length === 0) {
    throw new Error('Planner returned no subtasks');
  }
  const validRoles = ['research', 'analysis', 'coding', 'verification'];
  result.subtasks = result.subtasks.filter(s => validRoles.includes(s.agent_role) && s.subtask_text);
  if (result.subtasks.length === 0) throw new Error('Planner produced no valid subtasks');
  return result.subtasks;
}

// ---- Specialized agents ----
async function runResearchAgent(subtaskText, objectiveText, priorOutputs) {
  const system = `You are Seanight's Research agent. Your job: gather and state relevant factual information for this subtask, in service of the overall objective. Be concrete and specific. Do not speculate wildly — flag genuine uncertainty where it exists. Keep your answer focused, 3-8 sentences or a short list.`;
  const user = `Overall objective: ${objectiveText}\nYour subtask: ${subtaskText}\n${priorOutputs ? `Prior agent outputs so far:\n${priorOutputs}` : ''}`;
  return await callModel(system, user, false);
}
async function runAnalysisAgent(subtaskText, objectiveText, priorOutputs) {
  const system = `You are Seanight's Analysis agent. Your job: reason through, compare, or synthesize the information available into a clear conclusion for this subtask. Be direct about tradeoffs. Keep your answer focused, 3-8 sentences.`;
  const user = `Overall objective: ${objectiveText}\nYour subtask: ${subtaskText}\n${priorOutputs ? `Prior agent outputs so far:\n${priorOutputs}` : ''}`;
  return await callModel(system, user, false);
}
async function runVerificationAgentText(subtaskText, objectiveText, priorOutputs) {
  const system = `You are Seanight's Verification agent, running as a subtask (not the final check). Assess whether the prior outputs actually address this subtask. State clearly what's missing, if anything. Keep it to 2-5 sentences.`;
  const user = `Overall objective: ${objectiveText}\nYour subtask: ${subtaskText}\nPrior agent outputs so far:\n${priorOutputs || '(none yet)'}`;
  return await callModel(system, user, false);
}

// Coding agent: generates JS, runs it in a sandboxed iframe, captures reportResult()
async function runCodingAgent(subtaskText, objectiveText, priorOutputs) {
  const system = `You are Seanight's Coding agent. Write a single self-contained JavaScript snippet that accomplishes this subtask.
STRICT RULES:
- No network calls (fetch/XHR will not work — sandboxed, no network).
- No imports, no Node/npm, no browser DOM APIs beyond plain JS.
- You MUST call reportResult(value) exactly once with your final answer (string or JSON-serializable value).
- Wrap risky logic in try/catch and call reportResult with an error description string if something fails internally.
Respond with ONLY the raw JavaScript code, no markdown fences, no explanation.`;
  const user = `Overall objective: ${objectiveText}\nYour subtask: ${subtaskText}\n${priorOutputs ? `Prior agent outputs so far:\n${priorOutputs}` : ''}`;
  const code = await callModel(system, user, false);
  const cleanCode = code.replace(/^```(js|javascript)?\s*/i, '').replace(/```\s*$/, '');
  return await runInSandbox(cleanCode);
}

function runInSandbox(code) {
  return new Promise((resolve) => {
    const iframe = document.createElement('iframe');
    iframe.style.display = 'none';
    iframe.sandbox = 'allow-scripts'; // no allow-same-origin: fully isolated, no access to parent
    document.body.appendChild(iframe);

    const timeout = setTimeout(() => {
      cleanup();
      resolve({ ok: false, output: 'Sandboxed code timed out after 5 seconds.' });
    }, 5000);

    function cleanup() {
      clearTimeout(timeout);
      window.removeEventListener('message', onMessage);
      if (iframe.parentNode) iframe.parentNode.removeChild(iframe);
    }
    function onMessage(e) {
      if (e.source !== iframe.contentWindow) return;
      cleanup();
      if (e.data && e.data.type === 'result') {
        resolve({ ok: true, output: typeof e.data.value === 'string' ? e.data.value : JSON.stringify(e.data.value) });
      } else if (e.data && e.data.type === 'error') {
        resolve({ ok: false, output: 'Sandbox error: ' + e.data.message });
      }
    }
    window.addEventListener('message', onMessage);

    const doc = `<!DOCTYPE html><html><body><script>
      function reportResult(value) { parent.postMessage({ type: 'result', value: value }, '*'); }
      try {
        ${code}
      } catch (err) {
        parent.postMessage({ type: 'error', message: String(err && err.message || err) }, '*');
      }
    <\/script></body></html>`;
    iframe.srcdoc = doc;
  });
}

// ---- Final verification (against the whole objective) ----
async function runFinalVerification(objectiveText, subtaskResults) {
  const system = `You are Seanight's final Verification agent. Given the objective and all subtask outputs, decide whether the objective has genuinely been accomplished. Respond ONLY with valid JSON, no markdown fences:
{ "passed": true|false, "notes": "1-3 sentences explaining the verdict", "final_result": "if passed, a clear final answer/summary synthesized for the user; if not passed, empty string" }`;
  const user = `Objective: ${objectiveText}\n\nSubtask results:\n${subtaskResults}`;
  return await callModel(system, user, true);
}

// ---- Rendering helpers ----
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = String(str == null ? '' : str);
  return div.innerHTML;
}
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
function appendToStage(html) {
  const stage = document.getElementById('stage');
  const wrapper = document.createElement('div');
  wrapper.innerHTML = html;
  stage.appendChild(wrapper.firstElementChild);
}
function clearStage() { document.getElementById('stage').innerHTML = ''; }
function showThinking(msg) {
  document.getElementById('stage').innerHTML = `<div class="thinking-msg">${escapeHtml(msg)}<span class="cursor"></span></div>`;
}
function showFatalError(msg) {
  const stage = document.getElementById('stage');
  stage.innerHTML += `<div class="error-msg">${escapeHtml(msg)}</div>`;
}

function renderHistory() {
  const el = document.getElementById('history');
  document.getElementById('historyCount').textContent = `${history.length} objective${history.length===1?'':'s'}`;
  if (history.length === 0) { el.innerHTML = '<div class="empty-history">Nothing has happened yet.</div>'; return; }
  const reversed = [...history].reverse();
  el.innerHTML = reversed.map(o => {
    const time = new Date(o.created_at).toLocaleString(undefined, { month:'short', day:'numeric', hour:'numeric', minute:'2-digit' });
    const statusCls = o.status === 'completed' ? 'completed' : (o.status === 'error' ? 'error' : '');
    return `<div class="history-item ${statusCls}">
      <div class="h-objective">${escapeHtml(o.objective_text)}</div>
      <div class="h-status ${statusCls}">${escapeHtml(o.status)}</div>
      <div class="h-time">${time}</div>
    </div>`;
  }).join('');
}

// ---- Main execution flow for one objective ----
async function executeObjective(objectiveText) {
  clearStage();
  let dbObjective = null;

  try {
    setPipelineStep('connecting');
    dbObjective = await dbSubmitObjective(objectiveText);
    const objectiveId = dbObjective ? dbObjective.id : ('local-' + crypto.randomUUID());

    setPipelineStep('planning');
    showThinking('planning subtasks');
    const subtasks = await planObjective(objectiveText);
    if (dbObjective) await dbUpdateObjective(objectiveId, { status: 'executing', plan: subtasks });

    clearStage();
    appendToStage(`<div class="plan-block"><div class="label">Plan</div>
      <ol>${subtasks.map(s => `<li>[${escapeHtml(s.agent_role)}] ${escapeHtml(s.subtask_text)}</li>`).join('')}</ol>
    </div>`);
    await sleep(500);

    setPipelineStep('executing');
    let priorOutputsText = '';
    const subtaskResultsForVerification = [];

    for (let i = 0; i < subtasks.length; i++) {
      const st = subtasks[i];
      let dbSubtask = dbObjective ? await dbSubmitSubtask(objectiveId, st.agent_role, st.subtask_text, i) : null;
      const subtaskDbId = dbSubtask ? dbSubtask.id : null;

      appendToStage(`<div class="agent-block" id="agent-${i}">
        <div class="label"><span class="agent-role-tag ${escapeHtml(st.agent_role)}">${escapeHtml(st.agent_role)}</span> Running</div>
        <div class="subtask-text">${escapeHtml(st.subtask_text)}</div>
        <div class="output-text" id="agent-output-${i}">Working...</div>
      </div>`);

      let attempt = 1;
      let output = null;
      let succeeded = false;
      let lastError = null;

      while (attempt <= MAX_RETRIES_PER_SUBTASK && !succeeded) {
        try {
          if (st.agent_role === 'research') output = await runResearchAgent(st.subtask_text, objectiveText, priorOutputsText);
          else if (st.agent_role === 'analysis') output = await runAnalysisAgent(st.subtask_text, objectiveText, priorOutputsText);
          else if (st.agent_role === 'verification') output = await runVerificationAgentText(st.subtask_text, objectiveText, priorOutputsText);
          else if (st.agent_role === 'coding') {
            const codeResult = await runCodingAgent(st.subtask_text, objectiveText, priorOutputsText);
            if (!codeResult.ok) throw new Error(codeResult.output);
            output = codeResult.output;
          }
          succeeded = true;
        } catch (err) {
          lastError = err.message || String(err);
          attempt++;
        }
      }

      const block = document.getElementById(`agent-${i}`);
      const outputEl = document.getElementById(`agent-output-${i}`);

      if (succeeded) {
        outputEl.textContent = output;
        block.querySelector('.label').innerHTML = `<span class="agent-role-tag ${escapeHtml(st.agent_role)}">${escapeHtml(st.agent_role)}</span> Completed`;
        priorOutputsText += `\n[${st.agent_role}] ${st.subtask_text}\n→ ${output}\n`;
        subtaskResultsForVerification.push(`[${st.agent_role}] ${st.subtask_text}\n→ ${output}`);
        if (subtaskDbId) await dbUpdateSubtask(subtaskDbId, { status: 'completed', output, attempt });
      } else {
        block.classList.add('failed');
        outputEl.textContent = '';
        block.querySelector('.label').innerHTML = `<span class="agent-role-tag ${escapeHtml(st.agent_role)}">${escapeHtml(st.agent_role)}</span> Failed`;
        block.innerHTML += `<div class="status-line">Failed after ${MAX_RETRIES_PER_SUBTASK} attempts: ${escapeHtml(lastError)}</div>`;
        priorOutputsText += `\n[${st.agent_role}] ${st.subtask_text}\n→ FAILED: ${lastError}\n`;
        subtaskResultsForVerification.push(`[${st.agent_role}] ${st.subtask_text}\n→ FAILED: ${lastError}`);
        if (subtaskDbId) await dbUpdateSubtask(subtaskDbId, { status: 'failed', output: lastError, attempt });
      }
      await sleep(400);
    }

    setPipelineStep('verifying');
    showFatalError(''); // no-op, keep structure simple
    appendToStage(`<div class="verify-block" id="verify-block"><div class="label">Verification</div><div class="verdict">Checking result against objective...</div></div>`);

    let verdict;
    try {
      verdict = await runFinalVerification(objectiveText, subtaskResultsForVerification.join('\n\n'));
    } catch (err) {
      verdict = { passed: false, notes: 'Verification call failed: ' + (err.message || err), final_result: '' };
    }

    const verifyBlock = document.getElementById('verify-block');
    verifyBlock.classList.add(verdict.passed ? 'passed' : 'failed');
    verifyBlock.querySelector('.verdict').textContent = (verdict.passed ? '✓ Passed — ' : '✗ Not satisfied — ') + (verdict.notes || '');
    if (dbObjective) await dbSubmitVerification(objectiveId, !!verdict.passed, verdict.notes || '');

    if (verdict.passed) {
      appendToStage(`<div class="result-block"><div class="label">Final Result</div><div class="body">${escapeHtml(verdict.final_result || 'Objective completed.')}</div></div>`);
      setPipelineStep('completed');
      if (dbObjective) await dbUpdateObjective(objectiveId, { status: 'completed', final_result: verdict.final_result || '' });
      dbObjective = dbObjective || { id: objectiveId, session_id: SESSION_ID, objective_text: objectiveText, status: 'completed', created_at: new Date().toISOString() };
      dbObjective.status = 'completed';
    } else {
      appendToStage(`<div class="error-msg">Seanight was not able to fully satisfy this objective: ${escapeHtml(verdict.notes || 'unspecified reason')}</div>`);
      setPipelineStep('verifying', true);
      if (dbObjective) await dbUpdateObjective(objectiveId, { status: 'error', error_message: verdict.notes || 'Verification failed' });
      dbObjective = dbObjective || { id: objectiveId, session_id: SESSION_ID, objective_text: objectiveText, status: 'error', created_at: new Date().toISOString() };
      dbObjective.status = 'error';
    }

    history.push(dbObjective);
    renderHistory();

  } catch (err) {
    setPipelineStep(currentPipelineStep, true);
    showFatalError('Something went wrong: ' + (err.message || String(err)));
    if (dbObjective) {
      await dbUpdateObjective(dbObjective.id, { status: 'error', error_message: err.message || String(err) });
      dbObjective.status = 'error';
      history.push(dbObjective);
      renderHistory();
    }
  }
}

// ---- Boot ----
async function init() {
  setPipelineStep('waking');
  showThinking('waking up');
  await sleep(300);

  setPipelineStep('connecting');
  if (!SUPABASE_READY) {
    showFatalError('Supabase is not configured. Edit index.html and set SUPABASE_URL and SUPABASE_ANON_KEY. The app will still run, but history will not be saved.');
    await sleep(600);
  }
  history = await loadHistory();
  renderHistory();

  setPipelineStep('waking');
  clearStage();
  document.getElementById('stage').innerHTML = `<div class="thinking-msg">Ready. Enter an objective above to begin.</div>`;

  document.getElementById('submitBtn').addEventListener('click', onSubmit);
  document.getElementById('objectiveInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) onSubmit();
  });
}

let isRunning = false;
async function onSubmit() {
  try {
    if (isRunning) return;
    const input = document.getElementById('objectiveInput');
    const text = input.value.trim();
    if (!text) {
      input.style.borderColor = 'var(--accent-error)';
      setTimeout(() => { input.style.borderColor = ''; }, 1200);
      return;
    }
    isRunning = true;
    document.getElementById('submitBtn').disabled = true;
    await executeObjective(text);
  } catch (err) {
    document.getElementById('stage').innerHTML += `<div class="error-msg">onSubmit crashed: ${String(err && err.message || err)}</div>`;
  } finally {
    isRunning = false;
    const btn = document.getElementById('submitBtn');
    if (btn) btn.disabled = false;
  }
}

// Boot with a visible fallback if init() itself throws, so the page never fails silently
init().catch(err => {
  document.body.innerHTML += `<div style="position:fixed;bottom:0;left:0;right:0;background:#2a0e0e;color:#ff6b6b;font-family:monospace;font-size:12px;padding:16px;z-index:9999;">
    Startup failed: ${String(err && err.message || err)}<br>Stack: ${String(err && err.stack || '').slice(0,500)}
  </div>`;
});
</script>
